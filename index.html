<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Каталог приложений</title>

<style>
:root {
    --bg: #0a0a0c;
    --card-bg: #16161a;
    --card-border: rgba(255,255,255,.08);
    --text-main: #ffffff;
    --text-sub: #8e8e93;
    --text-dim: #636366;
    --accent-blue: #0a84ff;
    --badge-bg: #2c2c2e;
    --badge-text: #a1a1a6;
    --font: -apple-system, BlinkMacSystemFont,
            "SF Pro Display", "SF Pro Text",
            "Segoe UI", Roboto, sans-serif;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--bg);
    color: var(--text-main);
    font-family: var(--font);
    min-height: 100dvh;
    padding:
        max(20px, env(safe-area-inset-top))
        16px
        calc(90px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
}

.header {
    max-width: 500px;
    margin: 0 auto 16px;
}

.header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 12px;
    text-align: center;
}

.search-wrap {
    position: relative;
    width: 100%;
}

.search-input {
    width: 100%;
    height: 44px;
    background: #1c1c1e;
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 14px;
    padding: 0 16px 0 40px;
    font-size: 15px;
    color: #ffffff;
    outline: none;
}

.search-input:focus {
    border-color: rgba(255,255,255,.2);
}

.search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    pointer-events: none;
}

.cards-list {
    max-width: 500px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.app-row {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.app-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex: 1;
}

.icon-stack {
    position: relative;
    width: 56px;
    height: 56px;
    flex-shrink: 0;
}

.icon-main {
    width: 56px;
    height: 56px;
    border-radius: 13px;
    background: #2c2c2e;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 20px;
    font-weight: 700;
    color: #aeaeb2;

    overflow: hidden;
}

.icon-main img,
.icon-badge img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.icon-badge {
    position: absolute;
    bottom: -3px;
    right: -3px;

    width: 25px;
    height: 25px;

    border-radius: 7px;
    background: #3a3a3c;

    border: 2px solid var(--card-bg);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 9px;
    font-weight: 700;
    color: #ffffff;

    overflow: hidden;

    box-shadow: 0 2px 5px rgba(0,0,0,.5);
}

.app-meta {
    flex: 1;
    min-width: 0;

    display: flex;
    flex-direction: column;
    gap: 2px;
}

.app-title {
    font-size: 15px;
    font-weight: 700;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.app-mask-title {
    font-size: 13px;
    color: var(--text-sub);

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.badge {
    align-self: flex-start;

    background: var(--badge-bg);
    color: var(--badge-text);

    font-size: 11px;
    font-weight: 500;

    padding: 2px 7px;
    border-radius: 6px;

    margin-top: 2px;
}

.share-link {
    align-self: flex-start;

    margin-top: 4px;

    color: #6eaefc;
    font-size: 11px;

    cursor: pointer;
    user-select: none;
}

.share-link:active {
    opacity: .65;
}

.btn-download {
    background: var(--accent-blue);
    color: #ffffff;

    font-size: 13px;
    font-weight: 700;

    text-decoration: none;

    padding: 8px 14px;
    border-radius: 18px;

    flex-shrink: 0;

    display: inline-flex;
    align-items: center;
    gap: 4px;
}

.btn-download:active {
    transform: scale(.95);
    filter: brightness(.9);
}

/* =========================
   НИЖНЕЕ МЕНЮ
   ========================= */

.tabbar-wrap {
    position: fixed;

    bottom: max(14px, env(safe-area-inset-bottom));

    left: 0;
    right: 0;

    display: flex;
    justify-content: center;

    z-index: 999;

    pointer-events: none;
}

.tabbar {
    pointer-events: auto;

    background: rgba(30,30,35,.82);

    backdrop-filter: blur(25px) saturate(190%);
    -webkit-backdrop-filter: blur(25px) saturate(190%);

    border: 1px solid rgba(255,255,255,.12);

    border-radius: 30px;

    padding: 5px 8px;

    display: flex;
    align-items: center;
    gap: 6px;

    box-shadow: 0 14px 35px rgba(0,0,0,.55);
}

.tab-btn {
    background: transparent;

    border: none;

    color: #8e8e93;

    min-width: 44px;
    height: 38px;

    padding: 0 12px;

    border-radius: 20px;

    cursor: pointer;

    font-size: 12px;
    font-weight: 600;
}

.tab-btn.active {
    background: rgba(255,255,255,.16);
    color: #ffffff;
}

.hidden {
    display: none !important;
}

/* =========================
   РЕЖИМ ПРЯМОЙ ССЫЛКИ
   ?app=potok
   ========================= */

.direct-mode .search-wrap,
.direct-mode .tabbar-wrap {
    display: none;
}

.direct-mode .header {
    margin-bottom: 18px;
}

.direct-mode .header h1 {
    font-size: 22px;
}

.direct-mode .app-row {
    display: none !important;
}

.direct-mode .app-row.direct-app {
    display: flex !important;

    border-color: rgba(10,132,255,.75);

    box-shadow:
        0 0 0 2px rgba(10,132,255,.16);
}

.direct-actions {
    display: none;

    max-width: 500px;

    margin: 12px auto 0;

    gap: 8px;
}

.direct-mode .direct-actions {
    display: flex;
}

.secondary-btn {
    flex: 1;

    height: 40px;

    border: none;

    border-radius: 14px;

    background: #1c1c1e;

    color: #ffffff;

    font: inherit;

    font-size: 13px;
    font-weight: 600;

    cursor: pointer;
}

.not-found {
    display: none;

    max-width: 500px;

    margin: 30px auto;

    padding: 18px;

    border-radius: 18px;

    background: var(--card-bg);

    color: var(--text-sub);

    text-align: center;
}

body.app-not-found .not-found {
    display: block;
}

@media (max-width: 390px) {

    .app-row {
        padding: 11px 12px;
    }

    .btn-download {
        padding: 8px 11px;
        font-size: 12px;
    }

    .tab-btn {
        padding: 0 9px;
        font-size: 11px;
    }
}
    /* =========================
   ТАЙМЕР УСТАНОВКИ
   ========================= */

.download-timer {
    display: none;
    text-align: center;
    margin: 4px auto 18px;
}

.direct-mode .download-timer {
    display: block;
}

.timer-label {
    color: var(--text-sub);
    font-size: 13px;
    margin-bottom: 5px;
}

.timer-value {
    font-size: 30px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: -0.5px;
    font-variant-numeric: tabular-nums;
}

.download-timer.timer-expired .timer-label,
.download-timer.timer-expired .timer-value {
    color: #ff453a;
}

.btn-download.disabled {
    background: #3a3a3c;
    color: #8e8e93;
    pointer-events: none;
    opacity: 0.7;
}
</style>

</head>

<body>

<div class="header">

    <h1 id="pageTitle">Каталог</h1>
    <div class="download-timer" id="downloadTimer">
    <div class="timer-label" id="timerLabel">
        Ссылка на установку доступна ещё
    </div>

    <div class="timer-value" id="timerValue">
        30:00
    </div>
</div>

    <div class="search-wrap">

        <span class="search-icon">🔍</span>

        <input
            class="search-input"
            id="searchInput"
            placeholder="Поиск приложения..."
            type="text"
        >

    </div>

</div>


<div
    class="cards-list"
    id="appsContainer">
</div>


<div
    class="not-found"
    id="notFound">

    Приложение по этой ссылке не найдено.

</div>


<div class="direct-actions">

    <button
        class="secondary-btn"
        id="showAllBtn">

        ← Весь каталог

    </button>

    <button
        class="secondary-btn"
        id="shareCurrentBtn">

        🔗 Поделиться

    </button>

</div>


<div class="tabbar-wrap">

    <div class="tabbar">

        <button
            class="tab-btn active"
            data-filter="all">

            Все

        </button>

        <button
            class="tab-btn"
            data-filter="bank">

            Банки

        </button>

        <button
            class="tab-btn"
            data-filter="shop">

            Магазины

        </button>

        <button
            class="tab-btn"
            data-filter="social">

            Соцсети

        </button>

        <button
            class="tab-btn"
            data-filter="other">

            Прочее

        </button>

    </div>

</div>


<script>


/*
==================================================
ПРИЛОЖЕНИЯ
==================================================
*/

let apps = [];

/*
==================================================
СЛУЖЕБНЫЕ ФУНКЦИИ
==================================================
*/

let currentFilter = "all";


function escapeHtml(value) {

    return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");
}


function categoryName(category) {

    if (category === "bank") {
        return "Банки";
    }

    if (category === "shop") {
        return "Магазины";
    }

    if (category === "social") {
        return "Соцсети";
    }

    return "Прочее";
}


/*
==================================================
СОЗДАНИЕ КАРТОЧЕК
==================================================
*/

function renderApps() {

    const container =
        document.getElementById("appsContainer");


    container.innerHTML = apps.map(app => `

        <div
            class="app-row"
            id="app-${escapeHtml(app.slug)}"
            data-app="${escapeHtml(app.slug)}"
            data-category="${escapeHtml(app.category)}"
            data-search="${escapeHtml(app.search)}"
        >

            <div class="app-left">

                <div class="icon-stack">

                    <div class="icon-main">

                        <img
                            src="${escapeHtml(app.mainIcon)}"
                            alt="${escapeHtml(app.title)}"
                            onerror="this.parentElement.textContent='${escapeHtml(app.fallbackMain)}'"
                        >

                    </div>


                    <div class="icon-badge">

                        <img
                            src="${escapeHtml(app.badgeIcon)}"
                            alt="${escapeHtml(app.mask)}"
                            onerror="this.parentElement.textContent='${escapeHtml(app.fallbackBadge)}'"
                        >

                    </div>

                </div>


                <div class="app-meta">

                    <div class="app-title">
                        ${escapeHtml(app.title)}
                    </div>

                    <div class="app-mask-title">
                        ${escapeHtml(app.mask)}
                    </div>

                    <div class="badge">
                        ${categoryName(app.category)}
                    </div>

                    <div
                        class="share-link"
                        data-share="${escapeHtml(app.slug)}"
                    >

                        🔗 Скопировать ссылку

                    </div>

                </div>

            </div>


            <a
                class="btn-download"

                href="itms-services://?action=download-manifest&amp;url=${encodeURIComponent(app.manifest)}"

                rel="noopener"

                target="_self"
            >

                ⬇ Установить

            </a>

        </div>

    `).join("");
}


/*
==================================================
ПРЯМАЯ ССЫЛКА
==================================================
*/

function appUrl(slug) {

    const url =
        new URL(window.location.href);


    url.search = "";

    url.hash = "";


    url.searchParams.set(
        "app",
        slug
    );


    return url.toString();
}


/*
==================================================
ПОИСК / ФИЛЬТРЫ
==================================================
*/

function filterApps() {

    if (
        document.body.classList.contains(
            "direct-mode"
        )
    ) {
        return;
    }


    const query =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();


    document
        .querySelectorAll(".app-row")
        .forEach(card => {

            const category =
                card.dataset.category;


            const search =
                (card.dataset.search || "")
                    .toLowerCase();


            const categoryOK =
                currentFilter === "all"
                ||
                category === currentFilter;


            const searchOK =
                !query
                ||
                search.includes(query);


            card.classList.toggle(
                "hidden",
                !(categoryOK && searchOK)
            );

        });
}


/*
==================================================
ПОДЕЛИТЬСЯ
==================================================
*/

async function shareApp(slug) {

    const app =
        apps.find(
            item => item.slug === slug
        );


    if (!app) {
        return;
    }


    const url =
        appUrl(slug);


    /*
    На iPhone откроется
    стандартное меню "Поделиться"
    */

    if (navigator.share) {

        try {

            await navigator.share({

                title:
                    app.title,

                text:
                    `${app.title} — ${app.mask}`,

                url:
                    url

            });


            return;

        }
        catch (error) {

            if (
                error &&
                error.name === "AbortError"
            ) {
                return;
            }

        }

    }


    /*
    Если Web Share API
    недоступен — копируем
    */

    try {

        await navigator.clipboard.writeText(
            url
        );


        const element =
            Array.from(
                document.querySelectorAll(
                    "[data-share]"
                )
            )
            .find(
                item =>
                    item.dataset.share === slug
            );


        if (element) {

            const oldText =
                element.textContent;


            element.textContent =
                "✓ Ссылка скопирована";


            setTimeout(() => {

                element.textContent =
                    oldText;

            }, 1400);

        }

    }
    catch (error) {

        window.prompt(
            "Скопируйте ссылку:",
            url
        );

    }

}


/*
==================================================
ОТКРЫТИЕ ?app=
==================================================
*/

function openDirectApp() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const requested =
        params.get("app");


    /*
    Если ?app= нет —
    обычный каталог
    */

    if (!requested) {
        return;
    }


    const slug =
        requested
            .trim()
            .toLowerCase();


    const app =
        apps.find(

            item =>
                item.slug.toLowerCase()
                === slug

        );


    document.body.classList.add(
        "direct-mode"
    );


    /*
    Приложение не найдено
    */

    if (!app) {

        document.body.classList.add(
            "app-not-found"
        );


        document
            .getElementById("pageTitle")
            .textContent =
                "Приложение не найдено";


        return;
    }


    /*
    Находим карточку
    */

    const card =
        Array.from(
            document.querySelectorAll(
                ".app-row"
            )
        )
        .find(
            item =>
                item.dataset.app
                === app.slug
        );


    if (card) {

        card.classList.add(
            "direct-app"
        );

    }


    /*
    Меняем заголовок
    */

    document
        .getElementById("pageTitle")
        .textContent =
            app.title;


    document.title =
        `${app.title} — установка`;

}


/*
==================================================
КЛИК ПО "СКОПИРОВАТЬ ССЫЛКУ"
==================================================
*/

document.addEventListener(
    "click",
    event => {

        const share =
            event.target.closest(
                "[data-share]"
            );


        if (share) {

            shareApp(
                share.dataset.share
            );

        }

    }
);


/*
==================================================
ПОИСК
==================================================
*/

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        filterApps
    );


/*
==================================================
НИЖНЕЕ МЕНЮ
==================================================
*/

document
    .querySelectorAll(".tab-btn")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(".tab-btn")
                    .forEach(btn => {

                        btn.classList.remove(
                            "active"
                        );

                    });


                button.classList.add(
                    "active"
                );


                currentFilter =
                    button.dataset.filter;


                filterApps();

            }
        );

    });


/*
==================================================
ВЕСЬ КАТАЛОГ
==================================================
*/

document
    .getElementById("showAllBtn")
    .addEventListener(
        "click",
        () => {

            window.location.href =
                window.location.pathname;

        }
    );


/*
==================================================
ПОДЕЛИТЬСЯ В РЕЖИМЕ ?app=
==================================================
*/

document
    .getElementById("shareCurrentBtn")
    .addEventListener(
        "click",
        () => {

            const slug =
                new URLSearchParams(
                    window.location.search
                )
                .get("app");


            if (slug) {

                shareApp(
                    slug.toLowerCase()
                );

            }

        }
    );


/*
==================================================
ЗАПУСК
==================================================
*/
/*
==================================================
ТАЙМЕР ПРЯМОЙ ССЫЛКИ — 30 МИНУТ
==================================================
*/

const DOWNLOAD_LIFETIME = 30 * 60 * 1000;

let downloadTimerInterval = null;


function startDownloadTimer(slug) {

    if (!slug) {
        return;
    }


    const timerBox =
        document.getElementById(
            "downloadTimer"
        );


    const timerValue =
        document.getElementById(
            "timerValue"
        );


    const timerLabel =
        document.getElementById(
            "timerLabel"
        );


    if (
        !timerBox ||
        !timerValue ||
        !timerLabel
    ) {
        return;
    }


    /*
    Для каждого приложения свой таймер.

    potok -> свой
    abk -> свой
    gazprombank -> свой
    */

    const storageKey =
        "install_timer_" + slug;


    let expireTime =
        Number(
            localStorage.getItem(
                storageKey
            )
        );


    /*
    Если это первое открытие ссылки,
    запускаем новые 30 минут.
    */

    if (
        !expireTime ||
        Number.isNaN(expireTime)
    ) {

        expireTime =
            Date.now()
            +
            DOWNLOAD_LIFETIME;


        localStorage.setItem(
            storageKey,
            String(expireTime)
        );

    }


    function disableInstallButton() {

        const card =
            document.querySelector(
                ".direct-app"
            );


        if (!card) {
            return;
        }


        const button =
            card.querySelector(
                ".btn-download"
            );


        if (!button) {
            return;
        }


        /*
        Сохраняем исходную ссылку,
        если вдруг понадобится.
        */

        if (!button.dataset.installUrl) {

            button.dataset.installUrl =
                button.getAttribute("href")
                ||
                "";

        }


        button.classList.add(
            "disabled"
        );


        button.removeAttribute(
            "href"
        );


        button.textContent =
            "Время истекло";

    }


    function updateTimer() {

        const remaining =
            expireTime
            -
            Date.now();


        /*
        Время закончилось
        */

        if (remaining <= 0) {

            clearInterval(
                downloadTimerInterval
            );


            timerValue.textContent =
                "00:00";


            timerLabel.textContent =
                "Время для установки истекло";


            timerBox.classList.add(
                "timer-expired"
            );


            disableInstallButton();


            return;
        }


        /*
        Переводим миллисекунды
        в минуты и секунды
        */

        const totalSeconds =
            Math.ceil(
                remaining / 1000
            );


        const minutes =
            Math.floor(
                totalSeconds / 60
            );


        const seconds =
            totalSeconds % 60;


        timerValue.textContent =
            String(minutes)
                .padStart(
                    2,
                    "0"
                )
            +
            ":"
            +
            String(seconds)
                .padStart(
                    2,
                    "0"
                );

    }


    /*
    Сразу обновляем,
    чтобы не ждать первую секунду.
    */

    updateTimer();


    downloadTimerInterval =
        setInterval(
            updateTimer,
            1000
        );

}
async function loadApps() {

    try {

        const response =
            await fetch(
                "./apps.json?v=" + Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Не удалось загрузить apps.json"
            );

        }


        apps =
            await response.json();


        renderApps();


        openDirectApp();


        const directAppSlug =
            new URLSearchParams(
                window.location.search
            )
            .get("app");


        if (directAppSlug) {

            startDownloadTimer(
                directAppSlug
                    .trim()
                    .toLowerCase()
            );

        }

    }
    catch (error) {

        console.error(
            "Ошибка загрузки каталога:",
            error
        );


        document
            .getElementById(
                "appsContainer"
            )
            .innerHTML =
            `
            <div
                class="not-found"
                style="display:block"
            >
                Не удалось загрузить каталог приложений.
            </div>
